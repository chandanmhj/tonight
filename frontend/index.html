    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Tonight",
      "url": "https://YOUR-DOMAIN.com/",
      "description": "Movie suggestions filtered by mood, genre, runtime and the OTT apps you have in India.",
      "applicationCategory": "EntertainmentApplication",
      "operatingSystem": "Any",
      "inLanguage": "en-IN",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" },
      "areaServed": { "@type": "Country", "name": "India" }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How does Tonight pick movies?",
          "acceptedAnswer": { "@type": "Answer", "text": "You choose a mood, genres, how long you want to watch and which apps you have. Tonight suggests several movies at once, either from an AI or at random from well-rated films, and only shows ones streaming on your apps in India." }
        },
        {
          "@type": "Question",
          "name": "Which streaming apps does Tonight cover?",
          "acceptedAnswer": { "@type": "Answer", "text": "Netflix, Amazon Prime Video, JioHotstar, SonyLIV and other Indian OTT apps, using streaming data from TMDB." }
        },
        {
          "@type": "Question",
          "name": "How fresh is the streaming information?",
          "acceptedAnswer": { "@type": "Answer", "text": "Every movie is re-checked when it is shown and its data is more than 24 hours old, so you rarely see a movie that has left your app." }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Shown to search engines and before the app loads. React replaces it. -->
      <main style="font-family:system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem">
        <h1>Tonight: what to watch on your OTT apps</h1>
        <p>Choose your mood, favourite genres, how long you want to watch, and your apps: Netflix, Amazon Prime Video, JioHotstar or SonyLIV. Tonight suggests several movies that are streaming in India right now.</p>
        <noscript><p>Please turn on JavaScript to use Tonight.</p></noscript>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
